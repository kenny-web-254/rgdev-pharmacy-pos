name: Finish production auth and data-source hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[production-hardening]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic hardening script
        run: python3 scripts/production_hardening.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/storage.ts scripts/production_hardening.py
          git diff --cached --quiet || git commit -m "feat: finish production auth and data-source hardening [production-hardening]"
          git push
