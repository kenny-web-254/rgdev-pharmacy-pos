name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-build typecheck (diagnostic only)
        run: npm run lint
        continue-on-error: true

      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          echo "$code" > build.exit
          exit "$code"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: |
            build.log
            build.exit
      - name: Comment build diagnostics on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'build.log was not created.';
            const excerpt = log.slice(-18000);
            const body = '## Production build diagnostics\n\nThe Vercel-equivalent build failed. Last log output:\n\n```text\n' + excerpt + '\n```';
            const issueNumber = context.payload.pull_request?.number;
            if (issueNumber) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body });
            }
